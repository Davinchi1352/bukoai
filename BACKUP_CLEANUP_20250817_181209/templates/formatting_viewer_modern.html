<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ book.title }} - Vista Previa Profesional</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Crimson+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* 🎨 VARIABLES CSS MODERNAS */
        :root {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --primary-dark: #1d4ed8;
            --secondary: #64748b;
            --accent: #f59e0b;
            
            --white: #ffffff;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            
            --border-radius: 12px;
            --border-radius-sm: 8px;
            --border-radius-lg: 16px;
            
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'Crimson Pro', Georgia, serif;
        }

        /* 🚀 RESET Y BASE MODERNO */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--gray-50);
            color: var(--gray-900);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 📱 LAYOUT PRINCIPAL - MOBILE FIRST */
        .app-container {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 350px 1fr;
            grid-template-rows: auto 1fr;
            grid-template-areas: 
                "sidebar header"
                "sidebar main";
        }

        @media (max-width: 1024px) {
            .app-container {
                grid-template-columns: 1fr;
                grid-template-areas: 
                    "header"
                    "main";
            }
        }

        /* 🎯 HEADER MODERNO */
        .app-header {
            grid-area: header;
            background: var(--white);
            border-bottom: 1px solid var(--gray-200);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            z-index: 100;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--gray-900);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-title i {
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* 🎛️ SIDEBAR MODERNO */
        .sidebar {
            grid-area: sidebar;
            background: var(--white);
            border-right: 1px solid var(--gray-200);
            overflow-y: auto;
            padding: 2rem;
            box-shadow: var(--shadow-sm);
        }

        .sidebar-section {
            margin-bottom: 2rem;
        }

        .sidebar-section h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: 0.5rem;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--gray-300);
            border-radius: var(--border-radius-sm);
            font-size: 0.875rem;
            transition: all 0.2s ease;
            background: var(--white);
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgb(37 99 235 / 0.1);
        }

        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 0;
        }

        .form-checkbox input[type="checkbox"] {
            width: 1.25rem;
            height: 1.25rem;
            border-radius: var(--border-radius-sm);
            border: 1px solid var(--gray-300);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--border-radius-sm);
            font-weight: 500;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .btn-secondary:hover {
            background: var(--gray-200);
        }

        .btn-full {
            width: 100%;
            justify-content: center;
        }

        /* 📖 ÁREA PRINCIPAL - PREVIEW */
        .main-content {
            grid-area: main;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .preview-toolbar {
            background: var(--white);
            border-bottom: 1px solid var(--gray-200);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
        }

        .preview-info {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .quality-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--success);
            color: var(--white);
            border-radius: var(--border-radius);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .preview-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* 🎨 ÁREA DE PREVIEW PROFESIONAL */
        .preview-area {
            flex: 1;
            background: var(--gray-100);
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            justify-content: center;
        }

        .book-preview {
            width: 100%;
            max-width: 800px;
            background: var(--white);
            box-shadow: var(--shadow-xl);
            border-radius: var(--border-radius-lg);
            overflow: hidden;
            position: relative;
        }

        .book-content {
            padding: 3rem;
            font-family: var(--font-serif);
            font-size: 1rem;
            line-height: 1.7;
            color: var(--gray-800);
            min-height: 600px;
        }

        /* 📚 ESTILOS DE CONTENIDO DEL LIBRO */
        .book-content h1, .book-content h2, .book-content h3 {
            font-family: var(--font-serif);
            font-weight: 600;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: var(--gray-900);
        }

        .book-content h1 {
            font-size: 2.25rem;
            text-align: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .book-content h2 {
            font-size: 1.75rem;
            color: var(--primary);
        }

        .book-content h3 {
            font-size: 1.375rem;
        }

        .book-content p {
            margin-bottom: 1rem;
            text-align: justify;
        }

        .book-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
            box-shadow: var(--shadow);
            border-radius: var(--border-radius-sm);
            overflow: hidden;
        }

        .book-content table th {
            background: var(--primary);
            color: var(--white);
            padding: 1rem;
            text-align: left;
            font-weight: 600;
        }

        .book-content table td {
            padding: 0.875rem 1rem;
            border-bottom: 1px solid var(--gray-200);
        }

        .book-content table tr:nth-child(even) {
            background: var(--gray-50);
        }

        .book-content table tr:hover {
            background: var(--gray-100);
        }

        /* 🔄 LOADING STATES */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .loading-spinner {
            width: 3rem;
            height: 3rem;
            border: 3px solid var(--gray-200);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 0.875rem;
            color: var(--gray-600);
            font-weight: 500;
        }

        /* 📱 RESPONSIVE */
        @media (max-width: 1024px) {
            .sidebar {
                display: none;
            }
            
            .preview-area {
                padding: 1rem;
            }
            
            .book-content {
                padding: 2rem 1.5rem;
            }
        }

        @media (max-width: 640px) {
            .app-header {
                padding: 1rem;
            }
            
            .preview-toolbar {
                padding: 0.75rem 1rem;
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }
            
            .book-content {
                padding: 1.5rem 1rem;
            }
            
            .book-content h1 {
                font-size: 1.875rem;
            }
        }

        /* 🎯 UTILIDADES */
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .font-bold { font-weight: 600; }
        .text-primary { color: var(--primary); }
        .text-secondary { color: var(--gray-600); }
        .text-success { color: var(--success); }
        .text-warning { color: var(--warning); }
        .text-error { color: var(--error); }

        /* 🌟 ANIMACIONES SUAVES */
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- 🎯 HEADER -->
        <header class="app-header">
            <div class="header-title">
                <i class="fas fa-book-open"></i>
                {{ book.title }}
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="window.history.back()">
                    <i class="fas fa-arrow-left"></i>
                    Volver
                </button>
            </div>
        </header>

        <!-- 🎛️ SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3><i class="fas fa-cog"></i> Configuración</h3>
                
                <div class="form-group">
                    <label class="form-label">Fuente</label>
                    <select class="form-select" id="fontFamily">
                        <option value="Crimson Pro">Crimson Pro (Serif)</option>
                        <option value="Inter">Inter (Sans)</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Times New Roman">Times New Roman</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Tamaño de Fuente</label>
                    <select class="form-select" id="fontSize">
                        <option value="14">14px</option>
                        <option value="16" selected>16px</option>
                        <option value="18">18px</option>
                        <option value="20">20px</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Interlineado</label>
                    <select class="form-select" id="lineHeight">
                        <option value="1.4">1.4x</option>
                        <option value="1.6">1.6x</option>
                        <option value="1.7" selected>1.7x</option>
                        <option value="1.8">1.8x</option>
                        <option value="2.0">2.0x</option>
                    </select>
                </div>
            </div>

            <div class="sidebar-section">
                <h3><i class="fas fa-list"></i> Elementos</h3>
                
                <div class="form-checkbox">
                    <input type="checkbox" id="includeTableOfContents" checked>
                    <label for="includeTableOfContents">Tabla de Contenidos</label>
                </div>
                
                <div class="form-checkbox">
                    <input type="checkbox" id="includeDedication">
                    <label for="includeDedication">Dedicatoria</label>
                </div>
                
                <div class="form-checkbox">
                    <input type="checkbox" id="includePrologue">
                    <label for="includePrologue">Prólogo</label>
                </div>
                
                <div class="form-checkbox">
                    <input type="checkbox" id="includeAboutAuthor">
                    <label for="includeAboutAuthor">Sobre el Autor</label>
                </div>
            </div>

            <div class="sidebar-section">
                <button class="btn btn-primary btn-full" onclick="updatePreview()">
                    <i class="fas fa-sync"></i>
                    Actualizar Vista Previa
                </button>
            </div>
        </aside>

        <!-- 📖 CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <div class="preview-toolbar">
                <div class="preview-info">
                    <div class="quality-badge">
                        <i class="fas fa-star"></i>
                        <span id="qualityScore">85</span>% Calidad
                    </div>
                    <span class="text-secondary">Vista previa profesional</span>
                </div>
                <div class="preview-actions">
                    <button class="btn btn-secondary" onclick="toggleFullscreen()">
                        <i class="fas fa-expand"></i>
                        Pantalla Completa
                    </button>
                    <button class="btn btn-secondary" onclick="exportPreview()">
                        <i class="fas fa-download"></i>
                        Exportar
                    </button>
                </div>
            </div>

            <div class="preview-area">
                <div class="book-preview">
                    <div class="book-content" id="bookContent">
                        <div class="loading-overlay">
                            <div class="loading-spinner"></div>
                            <div class="loading-text">Generando vista previa profesional...</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 🚀 VISOR MODERNO - JAVASCRIPT LIMPIO
        class ModernBookViewer {
            constructor() {
                this.bookId = {{ book.id }};
                this.bookContent = document.getElementById('bookContent');
                this.qualityScore = document.getElementById('qualityScore');
                this.isLoading = false;
                
                this.init();
            }

            init() {
                // Cargar vista previa inicial
                this.updatePreview();
                
                // Event listeners para controles
                this.setupEventListeners();
            }

            setupEventListeners() {
                // Auto-actualizar cuando cambien los controles
                ['fontFamily', 'fontSize', 'lineHeight', 'includeTableOfContents', 
                 'includeDedication', 'includePrologue', 'includeAboutAuthor'].forEach(id => {
                    const element = document.getElementById(id);
                    if (element) {
                        element.addEventListener('change', () => this.updatePreview());
                    }
                });
            }

            async updatePreview() {
                if (this.isLoading) return;
                
                this.isLoading = true;
                this.showLoading();

                try {
                    const formData = this.collectFormData();
                    
                    const response = await fetch(`/books/book/${this.bookId}/formatting-preview`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(formData)
                    });

                    const data = await response.json();
                    
                    if (data.success && data.formatted_content) {
                        // ✅ SIN DUPLICACIÓN: Mostrar contenido directamente
                        this.bookContent.innerHTML = data.formatted_content;
                        this.bookContent.classList.add('fade-in');
                        
                        // Aplicar configuraciones de fuente
                        this.applyFontSettings();
                        
                        // Actualizar calidad
                        if (data.quality_score) {
                            this.qualityScore.textContent = Math.round(data.quality_score);
                        }
                        
                    } else {
                        this.showError('Error generando vista previa');
                    }

                } catch (error) {
                    console.error('Error updating preview:', error);
                    this.showError('Error de conexión');
                } finally {
                    this.isLoading = false;
                }
            }

            collectFormData() {
                return {
                    font_family: document.getElementById('fontFamily')?.value || 'Crimson Pro',
                    font_size_body: parseInt(document.getElementById('fontSize')?.value) || 16,
                    line_height: parseFloat(document.getElementById('lineHeight')?.value) || 1.7,
                    include_table_of_contents: document.getElementById('includeTableOfContents')?.checked || false,
                    include_dedication: document.getElementById('includeDedication')?.checked || false,
                    include_prologue: document.getElementById('includePrologue')?.checked || false,
                    include_about_author: document.getElementById('includeAboutAuthor')?.checked || false,
                    use_professional_typography: true
                };
            }

            applyFontSettings() {
                const fontFamily = document.getElementById('fontFamily').value;
                const fontSize = document.getElementById('fontSize').value + 'px';
                const lineHeight = document.getElementById('lineHeight').value;
                
                this.bookContent.style.fontFamily = fontFamily === 'Crimson Pro' ? 'var(--font-serif)' : fontFamily;
                this.bookContent.style.fontSize = fontSize;
                this.bookContent.style.lineHeight = lineHeight;
            }

            showLoading() {
                this.bookContent.innerHTML = `
                    <div class="loading-overlay">
                        <div class="loading-spinner"></div>
                        <div class="loading-text">Actualizando vista previa...</div>
                    </div>
                `;
            }

            showError(message) {
                this.bookContent.innerHTML = `
                    <div style="text-align: center; padding: 4rem; color: var(--error);">
                        <i class="fas fa-exclamation-triangle" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                        <h3 style="margin-bottom: 1rem;">${message}</h3>
                        <button class="btn btn-primary" onclick="viewer.updatePreview()">
                            <i class="fas fa-sync"></i>
                            Reintentar
                        </button>
                    </div>
                `;
            }
        }

        // 🌟 FUNCIONES GLOBALES
        function updatePreview() {
            viewer.updatePreview();
        }

        function toggleFullscreen() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                document.documentElement.requestFullscreen();
            }
        }

        function exportPreview() {
            // TODO: Implementar export
            alert('Función de exportar próximamente disponible');
        }

        // 🚀 INICIALIZAR APLICACIÓN
        let viewer;
        document.addEventListener('DOMContentLoaded', function() {
            viewer = new ModernBookViewer();
        });
    </script>
</body>
</html>
